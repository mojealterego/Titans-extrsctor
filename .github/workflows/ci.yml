name: TITANS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Validate Docker Compose
        run: TITANS_API_TOKEN=ci-ephemeral-token-not-for-deployment docker compose config --quiet
      - name: Container image build
        run: docker build -t titans-extractor:ci .
      - name: Package CLI source distribution
        run: mkdir -p dist && npm pack --pack-destination dist
      - name: Publish verified CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: titans-extractor-node22
          path: dist/*.tgz
          if-no-files-found: error
